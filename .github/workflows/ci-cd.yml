name: CI/CD Pipeline - Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Secret Configuration
        run: |
          echo "Checking secrets..."
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::warning::DOCKERHUB_USERNAME secret is empty!"
          else
            echo "DOCKERHUB_USERNAME secret is set."
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is empty!"
          else
            echo "DOCKERHUB_TOKEN secret is set."
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'shivam092' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'shivam092' }}/sample-web-app:v1.0.${{ github.run_number }}
